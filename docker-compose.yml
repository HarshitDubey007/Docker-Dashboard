services:
  dashboard:
    build: .
    image: docker-dashboard:latest
    container_name: docker-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DATA_DIR: /app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me); [ \"$$code\" -lt 500 ] && [ -n \"$$code\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
