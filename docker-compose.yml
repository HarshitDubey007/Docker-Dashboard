services:
  dashboard:
    build: .
    image: docker-dashboard:latest
    container_name: docker-dashboard
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required — run ./deploy.sh or set it in .env}"
    ports:
      - "3006:3006"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Named volume (not a host bind mount) so the container's non-root user
      # (UID 1001) can always write — Docker seeds it from the image's /app/data,
      # which is owned by that user. Avoids host-UID/permission issues entirely
      # (esp. macOS Docker Desktop). Inspect/back it up via `docker compose cp`.
      - dashboard-data:/app/data
    environment:
      PORT: 3006
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DATA_DIR: /app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3006/api/auth/me); [ \"$$code\" -lt 500 ] && [ -n \"$$code\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard-data:
