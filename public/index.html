<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Docker Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">&gt; DOCKER<span class="logo-sub">_DASHBOARD</span></div>

      <div class="server-switcher" id="server-switcher">
        <div class="current" id="server-current">
          <span class="dot unknown"></span>
          <div style="flex:1">
            <div class="name" id="sc-name">Loading…</div>
            <div class="small text-muted" id="sc-meta"></div>
          </div>
          <span class="text-muted">▾</span>
        </div>
        <div class="dropdown hidden" id="server-dropdown"></div>
      </div>

      <div class="spacer"></div>
      <nav id="main-nav" class="flex gap-1"></nav>
      <div id="user-area" class="flex gap-1"></div>
    </header>

    <div class="metrics-strip" id="metrics-strip">
      <div class="metric-tile" id="tile-cpu">
        <div class="mt-label">HOST CPU</div>
        <div class="mt-value"><span id="mt-cpu-val">—</span><span class="mt-unit">%</span></div>
        <div class="mt-bar"><div class="mt-bar-fill" id="mt-cpu-bar"></div></div>
        <div class="mt-sub" id="mt-cpu-sub">—</div>
      </div>
      <div class="metric-tile" id="tile-mem">
        <div class="mt-label">HOST MEMORY</div>
        <div class="mt-value"><span id="mt-mem-val">—</span><span class="mt-unit">%</span></div>
        <div class="mt-bar"><div class="mt-bar-fill" id="mt-mem-bar"></div></div>
        <div class="mt-sub" id="mt-mem-sub">—</div>
      </div>
      <div class="metric-tile" id="tile-containers">
        <div class="mt-label">CONTAINERS</div>
        <div class="mt-value"><span id="mt-ct-running">—</span><span class="mt-unit">/ <span id="mt-ct-total">—</span></span></div>
        <div class="mt-sub">running / total</div>
      </div>
      <div class="metric-tile" id="tile-docker">
        <div class="mt-label">DOCKER</div>
        <div class="mt-value-sm" id="mt-docker-ver">—</div>
        <div class="mt-sub" id="mt-docker-os">—</div>
      </div>
    </div>

    <div class="app-body">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="title">
            <span class="dot unknown" id="sb-dot"></span>
            <span id="sb-server-name">—</span>
          </div>
          <div class="sub" id="sb-server-sub">0 containers</div>
        </div>
        <div class="sidebar-search">
          <input id="search" placeholder="Search containers…" />
        </div>
        <div id="server-banner"></div>
        <div class="sidebar-list" id="container-list">
          <div class="empty-state" style="padding:24px;">Loading…</div>
        </div>
      </aside>

      <main class="main-panel" id="main-panel">
        <div class="empty-state">
          <div class="icon">⎔</div>
          <div>Select a container to view details</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!API.requireAuth()) throw new Error('redirecting');

    let servers = [];
    let selectedServerId = localStorage.getItem('dd_selected_server');
    let containers = [];
    let selectedContainerId = null;
    let logStream = null;
    let statusStream = null;
    let metricsStream = null;
    let metricsServerId = null;
    // Per-container ring buffer of samples. Map<containerId, Array<{ts, cpu, mem, memPct}>>
    const SAMPLE_WINDOW = 150; // ~5 min at 2s cadence
    const samplesByContainer = new Map();

    async function boot() {
      await API.loadCurrentUser();
      API.renderUserBadge(document.getElementById('user-area'));
      API.renderAdminNav(document.getElementById('main-nav'));

      await refreshServers();
      startStatusStream();

      document.getElementById('server-current').onclick = () => {
        document.getElementById('server-dropdown').classList.toggle('hidden');
      };
      document.addEventListener('click', (e) => {
        const sw = document.getElementById('server-switcher');
        if (!sw.contains(e.target)) document.getElementById('server-dropdown').classList.add('hidden');
      });

      document.getElementById('search').addEventListener('input', renderContainers);

      // periodic container refresh
      setInterval(() => { if (selectedServerId) loadContainers(); }, 10000);

      if (selectedServerId) startMetricsStream(selectedServerId);
    }

    async function refreshServers() {
      try {
        const { servers: list } = await API.apiFetch('/api/servers');
        servers = list;
        if (!selectedServerId || !servers.find(s => s.id === selectedServerId)) {
          const conn = servers.find(s => s.status === 'connected') || servers[0];
          selectedServerId = conn ? conn.id : null;
          if (selectedServerId) localStorage.setItem('dd_selected_server', selectedServerId);
        }
        renderServerSwitcher();
        renderSidebarHeader();
        if (selectedServerId) await loadContainers();
      } catch (e) {
        console.error(e);
      }
    }

    function renderServerSwitcher() {
      const current = servers.find(s => s.id === selectedServerId);
      if (!current) {
        document.getElementById('sc-name').textContent = 'No servers';
        document.getElementById('sc-meta').textContent = '';
        document.getElementById('server-current').querySelector('.dot').className = 'dot unknown';
      } else {
        document.getElementById('sc-name').innerHTML = `${API.escapeHtml(current.name)} <span class="badge ${current.type}">${current.type.toUpperCase()}</span>`;
        const meta = current.status === 'connected' && current.version
          ? `Docker ${API.escapeHtml(current.version)} · ${API.escapeHtml(current.os || '')}`
          : current.type === 'remote' ? `${API.escapeHtml(current.host || '')}:${current.port || ''}` : '/var/run/docker.sock';
        document.getElementById('sc-meta').textContent = meta;
        document.getElementById('server-current').querySelector('.dot').className = `dot ${current.status || 'unknown'}`;
      }

      const dd = document.getElementById('server-dropdown');
      if (!servers.length) {
        dd.innerHTML = `<div class="item"><div class="info"><div class="name text-muted">No servers configured</div></div></div>`;
        return;
      }
      dd.innerHTML = servers.map(s => `
        <div class="item ${s.id === selectedServerId ? 'selected' : ''}" data-id="${s.id}">
          <span class="dot ${s.status || 'unknown'}"></span>
          <div class="info">
            <div class="name">${API.escapeHtml(s.name)} <span class="badge ${s.type}">${s.type.toUpperCase()}</span></div>
            <div class="meta">${
              s.type === 'local' ? 'Local socket' :
              `${API.escapeHtml(s.host || '')}:${s.port || ''}${s.tls ? ' · TLS' : ''}`
            } · ${s.status || 'unknown'}${typeof s.containerCount === 'number' ? ` · ${s.containerCount} containers` : ''}</div>
          </div>
        </div>
      `).join('');
      dd.querySelectorAll('.item').forEach(el => {
        el.onclick = () => {
          selectedServerId = el.dataset.id;
          localStorage.setItem('dd_selected_server', selectedServerId);
          selectedContainerId = null;
          dd.classList.add('hidden');
          renderServerSwitcher();
          renderSidebarHeader();
          renderDetail(null);
          loadContainers();
          startMetricsStream(selectedServerId);
        };
      });
    }

    function renderSidebarHeader() {
      const s = servers.find(x => x.id === selectedServerId);
      document.getElementById('sb-dot').className = `dot ${s?.status || 'unknown'}`;
      document.getElementById('sb-server-name').textContent = s?.name || '—';
      document.getElementById('sb-server-sub').textContent = s
        ? `${typeof s.containerCount === 'number' ? s.containerCount : 0} containers${s.status === 'connected' && s.version ? ` · Docker ${s.version}` : ''}`
        : '';

      const banner = document.getElementById('server-banner');
      if (s && s.status === 'error') {
        banner.innerHTML = `<div class="banner">Server unreachable. Last checked ${API.timeAgo(s.lastChecked)}.${s.errorMessage ? '<br>' + API.escapeHtml(s.errorMessage) : ''}</div>`;
      } else if (s && s.status === 'unknown') {
        banner.innerHTML = `<div class="banner warn">Checking connection…</div>`;
      } else {
        banner.innerHTML = '';
      }
    }

    async function loadContainers() {
      if (!selectedServerId) return;
      try {
        const { containers: list } = await API.apiFetch(`/api/servers/${selectedServerId}/containers`);
        containers = list;
        renderContainers();
      } catch (e) {
        containers = [];
        renderContainers();
        document.getElementById('container-list').innerHTML =
          `<div class="empty-state" style="padding:24px;">${API.escapeHtml(e.message)}</div>`;
      }
    }

    function renderContainers() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const list = containers.filter(c =>
        !q || c.name.toLowerCase().includes(q) || c.image.toLowerCase().includes(q) || c.shortId.toLowerCase().includes(q)
      );
      const el = document.getElementById('container-list');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state" style="padding:24px;">No containers</div>`;
        return;
      }
      el.innerHTML = list.map(c => `
        <div class="container-item ${c.id === selectedContainerId ? 'selected' : ''}" data-id="${c.id}">
          <div class="info">
            <div class="name">${API.escapeHtml(c.name)}</div>
            <div class="image">${API.escapeHtml(c.image)}</div>
          </div>
          <div class="ci-meta">
            <canvas class="ci-spark" data-id="${c.id}" width="60" height="20"></canvas>
            <span class="state ${c.state}">${c.state}</span>
          </div>
        </div>
      `).join('');
      el.querySelectorAll('.container-item').forEach(n => {
        n.onclick = () => {
          selectedContainerId = n.dataset.id;
          renderContainers();
          renderDetail(containers.find(c => c.id === selectedContainerId));
        };
      });
      redrawSparklines();
    }

    function renderDetail(container) {
      const mp = document.getElementById('main-panel');
      if (logStream) { logStream.close(); logStream = null; }
      if (!container) {
        mp.innerHTML = `<div class="empty-state"><div class="icon">⎔</div><div>Select a container to view details</div></div>`;
        return;
      }
      mp.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="title">${API.escapeHtml(container.name)} <span class="state ${container.state}">${container.state}</span></div>
            <div class="sub">${API.escapeHtml(container.image)} · ${API.escapeHtml(container.shortId)}</div>
          </div>
          <div class="detail-actions">
            <button id="act-start" ${container.state === 'running' ? 'disabled' : ''}>Start</button>
            <button id="act-stop" ${container.state !== 'running' ? 'disabled' : ''}>Stop</button>
            <button id="act-restart">Restart</button>
          </div>
        </div>
        <div class="tabs">
          <div class="tab active" data-tab="logs">Logs</div>
          <div class="tab" data-tab="metrics">Metrics</div>
          <div class="tab" data-tab="inspect">Inspect</div>
        </div>
        <div class="tab-content">
          <div class="tab-pane active" id="pane-logs">
            <div class="logs-view" id="logs"></div>
          </div>
          <div class="tab-pane" id="pane-metrics">
            <div class="metrics-view">
              <div class="chart-block">
                <div class="chart-head">
                  <div class="chart-title">CPU</div>
                  <div class="chart-current" id="chart-cpu-cur">—</div>
                </div>
                <canvas class="chart-canvas" id="chart-cpu" height="140"></canvas>
              </div>
              <div class="chart-block">
                <div class="chart-head">
                  <div class="chart-title">Memory</div>
                  <div class="chart-current" id="chart-mem-cur">—</div>
                </div>
                <canvas class="chart-canvas" id="chart-mem" height="140"></canvas>
              </div>
            </div>
          </div>
          <div class="tab-pane" id="pane-inspect">
            <div class="inspect-view"><pre id="inspect">Loading…</pre></div>
          </div>
        </div>
      `;
      mp.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          mp.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          mp.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
          t.classList.add('active');
          document.getElementById(`pane-${t.dataset.tab}`).classList.add('active');
          if (t.dataset.tab === 'inspect') loadInspect(container.id);
          if (t.dataset.tab === 'metrics') redrawDetailCharts();
        };
      });

      document.getElementById('act-start').onclick = () => containerAction(container.id, 'start');
      document.getElementById('act-stop').onclick = () => containerAction(container.id, 'stop');
      document.getElementById('act-restart').onclick = () => containerAction(container.id, 'restart');

      startLogStream(container.id);
    }

    async function containerAction(id, action) {
      try {
        await API.apiFetch(`/api/servers/${selectedServerId}/containers/${id}/${action}`, { method: 'POST' });
        setTimeout(loadContainers, 500);
      } catch (e) {
        alert(`Action failed: ${e.message}`);
      }
    }

    function startLogStream(id) {
      const el = document.getElementById('logs');
      el.textContent = '';
      const token = API.getToken();
      const url = `/api/servers/${selectedServerId}/containers/${id}/logs?token=${encodeURIComponent(token)}`;
      logStream = new EventSource(url);
      logStream.onmessage = (ev) => {
        try {
          const { line } = JSON.parse(ev.data);
          const div = document.createElement('div');
          div.className = 'log-line';
          div.textContent = line;
          el.appendChild(div);
          if (el.childElementCount > 1000) el.removeChild(el.firstChild);
          el.scrollTop = el.scrollHeight;
        } catch (_) {}
      };
      logStream.addEventListener('error', () => {});
    }

    async function loadInspect(id) {
      try {
        const data = await API.apiFetch(`/api/servers/${selectedServerId}/containers/${id}/inspect`);
        document.getElementById('inspect').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById('inspect').textContent = `Error: ${e.message}`;
      }
    }

    function startStatusStream() {
      if (statusStream) statusStream.close();
      const token = API.getToken();
      statusStream = new EventSource(`/api/servers/status/stream?token=${encodeURIComponent(token)}`);
      statusStream.addEventListener('snapshot', (ev) => {
        try {
          const snap = JSON.parse(ev.data);
          snap.forEach(applyStatus);
        } catch (_) {}
      });
      statusStream.onmessage = (ev) => {
        try { applyStatus(JSON.parse(ev.data)); } catch (_) {}
      };
    }

    function applyStatus(payload) {
      const s = servers.find(x => x.id === payload.serverId);
      if (!s) { refreshServers(); return; }
      s.status = payload.status;
      s.lastChecked = payload.lastChecked;
      s.errorMessage = payload.error;
      renderServerSwitcher();
      if (payload.serverId === selectedServerId) {
        renderSidebarHeader();
        if (payload.status === 'connected') loadContainers();
      }
    }

    function startMetricsStream(serverId) {
      if (metricsStream) { metricsStream.close(); metricsStream = null; }
      samplesByContainer.clear();
      metricsServerId = serverId;
      const token = API.getToken();
      metricsStream = new EventSource(`/api/servers/${serverId}/metrics/stream?token=${encodeURIComponent(token)}`);
      metricsStream.onmessage = (ev) => {
        try {
          const payload = JSON.parse(ev.data);
          applyMetrics(payload);
        } catch (_) {}
      };
      metricsStream.addEventListener('error', () => {});
    }

    function applyMetrics(payload) {
      if (payload.host) renderHostTiles(payload.host);
      const seen = new Set();
      for (const c of payload.containers || []) {
        seen.add(c.id);
        let buf = samplesByContainer.get(c.id);
        if (!buf) { buf = []; samplesByContainer.set(c.id, buf); }
        buf.push({ ts: payload.ts, cpu: c.cpuPercent, mem: c.memUsed, memPct: c.memPercent });
        while (buf.length > SAMPLE_WINDOW) buf.shift();
      }
      // Push a zero sample for running containers we didn't get stats for this tick
      // (keeps sparkline time-aligned). Drop buffers for containers that disappeared.
      for (const id of Array.from(samplesByContainer.keys())) {
        if (!seen.has(id)) samplesByContainer.delete(id);
      }
      redrawSparklines();
      if (selectedContainerId && samplesByContainer.has(selectedContainerId)) {
        redrawDetailCharts();
      }
    }

    function renderHostTiles(host) {
      const cpu = host.cpu?.percent ?? 0;
      const mem = host.memory?.percent ?? 0;
      document.getElementById('mt-cpu-val').textContent = cpu.toFixed(1);
      document.getElementById('mt-cpu-bar').style.width = `${Math.min(100, cpu)}%`;
      document.getElementById('mt-cpu-sub').textContent = `${host.cpu?.cores ?? 0} cores`;
      document.getElementById('mt-mem-val').textContent = mem.toFixed(1);
      document.getElementById('mt-mem-bar').style.width = `${Math.min(100, mem)}%`;
      document.getElementById('mt-mem-sub').textContent =
        `${fmtBytes(host.memory?.used)} / ${fmtBytes(host.memory?.total)}`;
      document.getElementById('mt-ct-running').textContent = host.containers?.running ?? 0;
      document.getElementById('mt-ct-total').textContent = host.containers?.total ?? 0;
      document.getElementById('mt-docker-ver').textContent = host.docker?.version || '—';
      document.getElementById('mt-docker-os').textContent = host.docker?.os || '';
    }

    function redrawSparklines() {
      document.querySelectorAll('.ci-spark').forEach((cv) => {
        const buf = samplesByContainer.get(cv.dataset.id) || [];
        drawSpark(cv, buf.map(s => s.cpu));
      });
    }

    function drawSpark(canvas, values) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!values.length) return;
      const max = Math.max(5, ...values);
      ctx.strokeStyle = '#4cd4a8';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = (i / Math.max(1, values.length - 1)) * w;
        const y = h - (v / max) * (h - 2) - 1;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function redrawDetailCharts() {
      const buf = samplesByContainer.get(selectedContainerId) || [];
      const cpuCanvas = document.getElementById('chart-cpu');
      const memCanvas = document.getElementById('chart-mem');
      if (!cpuCanvas || !memCanvas) return;
      const latest = buf[buf.length - 1];
      if (latest) {
        document.getElementById('chart-cpu-cur').textContent = `${latest.cpu.toFixed(2)}%`;
        document.getElementById('chart-mem-cur').textContent =
          `${fmtBytes(latest.mem)} (${latest.memPct.toFixed(1)}%)`;
      }
      drawChart(cpuCanvas, buf.map(s => s.cpu), { unit: '%', minMax: 5, color: '#4cd4a8' });
      drawChart(memCanvas, buf.map(s => s.mem), { unit: 'bytes', minMax: 1024 * 1024, color: '#6aa9ff' });
    }

    function drawChart(canvas, values, opts) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || canvas.parentElement.clientWidth;
      const cssH = canvas.clientHeight || 140;
      if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
        canvas.width = cssW * dpr;
        canvas.height = cssH * dpr;
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = cssW, h = cssH;
      ctx.clearRect(0, 0, w, h);

      // Axes
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = (h / 4) * i + 0.5;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      if (!values.length) return;
      const max = Math.max(opts.minMax, ...values);
      // Labels
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '10px ui-monospace, monospace';
      ctx.textAlign = 'right';
      ctx.fillText(opts.unit === 'bytes' ? fmtBytes(max) : `${max.toFixed(0)}${opts.unit}`, w - 4, 10);
      ctx.fillText(opts.unit === 'bytes' ? '0' : `0${opts.unit}`, w - 4, h - 4);

      // Filled line
      ctx.strokeStyle = opts.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = (i / Math.max(1, values.length - 1)) * w;
        const y = h - (v / max) * (h - 6) - 2;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      // Soft fill under
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fillStyle = opts.color + '22';
      ctx.fill();
    }

    function fmtBytes(n) {
      if (!n || n <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    boot();
  </script>
</body>
</html>
