<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Services · Docker Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Page-scoped styles for the unified services view. No build step — plain
       CSS reusing the shared design tokens from styles.css. */
    .svc-wrap { padding: 18px; overflow: auto; }
    .svc-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .svc-toolbar .grow { flex: 1; min-width: 160px; }
    .svc-toolbar select, .svc-toolbar input { width: auto; min-width: 180px; }
    .chips { display: flex; gap: 6px; }
    .chip {
      padding: 4px 10px; border: 1px solid var(--border-strong); border-radius: 999px;
      cursor: pointer; font-size: 11px; color: var(--fg-muted); background: var(--bg-raised);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .chip.active { color: var(--accent); border-color: var(--accent); }
    table.svc { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.svc th {
      text-align: left; padding: 8px 10px; color: var(--fg-muted); font-weight: 500;
      text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg);
    }
    table.svc td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.svc tr:hover td { background: var(--bg-panel); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge.docker { background: var(--info); color: #06161f; }
    .badge.pm2 { background: var(--purple); color: #110820; }
    .badge.systemd { background: var(--warn); color: #1a1303; }
    .state.errored { background: rgba(255,79,107,0.15); color: var(--danger); }
    .state.unknown { background: rgba(107,122,140,0.15); color: var(--fg-muted); }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .row-actions button { padding: 4px 9px; font-size: 11px; }
    .src-note { color: var(--warn); font-size: 11px; margin-bottom: 10px; }
    .svc-name { font-weight: 500; color: var(--fg); }
    /* Logs modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
      align-items: stretch; justify-content: flex-end; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(820px, 90vw); background: var(--bg-panel); border-left: 1px solid var(--border-strong);
      display: flex; flex-direction: column;
    }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .modal-head .spacer { flex: 1; }
    .modal .logs-view { flex: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">&gt; DOCKER<span class="logo-sub">_DASHBOARD</span></div>
      <div class="spacer"></div>
      <nav id="main-nav" class="flex gap-1"></nav>
      <div id="user-area" class="flex gap-1"></div>
    </header>

    <div class="svc-wrap">
      <div class="svc-toolbar">
        <select id="server-select" title="Server"></select>
        <div class="chips" id="source-chips"></div>
        <input class="grow" id="search" placeholder="Search services…" />
        <button class="ghost" id="refresh-btn">Refresh</button>
      </div>
      <div id="src-notes"></div>
      <table class="svc">
        <thead>
          <tr>
            <th>Service</th>
            <th>Source</th>
            <th>Status</th>
            <th class="num">CPU %</th>
            <th class="num">Memory</th>
            <th class="num">Restarts</th>
            <th class="num">Uptime</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="svc-body">
          <tr><td colspan="8" class="empty-state" style="padding:24px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-backdrop" id="logs-modal">
    <div class="modal">
      <div class="modal-head">
        <span class="badge" id="lm-source"></span>
        <strong id="lm-title">Logs</strong>
        <div class="spacer"></div>
        <button class="ghost" id="lm-close">Close</button>
      </div>
      <div class="logs-view" id="lm-logs"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!API.requireAuth()) throw new Error('redirecting');

    let user = null;
    let servers = [];
    let selectedServerId = localStorage.getItem('dd_selected_server');
    let services = [];
    let sourceMeta = [];
    let sourceFilter = 'all';
    let logStream = null;

    async function boot() {
      user = await API.loadCurrentUser();
      API.renderUserBadge(document.getElementById('user-area'));
      API.renderAdminNav(document.getElementById('main-nav'));

      document.getElementById('search').addEventListener('input', renderTable);
      document.getElementById('refresh-btn').onclick = loadServices;
      document.getElementById('server-select').onchange = (e) => {
        selectedServerId = e.target.value;
        localStorage.setItem('dd_selected_server', selectedServerId);
        loadServices();
      };
      document.getElementById('lm-close').onclick = closeLogs;
      document.getElementById('logs-modal').onclick = (e) => {
        if (e.target.id === 'logs-modal') closeLogs();
      };

      await loadServers();
      await loadServices();
      // Live-ish refresh; services list includes a stats read so keep it gentle.
      setInterval(loadServices, 10000);
    }

    async function loadServers() {
      try {
        const { servers: list } = await API.apiFetch('/api/servers');
        servers = list;
        if (!selectedServerId || !servers.find((s) => s.id === selectedServerId)) {
          const conn = servers.find((s) => s.status === 'connected') || servers[0];
          selectedServerId = conn ? conn.id : null;
          if (selectedServerId) localStorage.setItem('dd_selected_server', selectedServerId);
        }
        const sel = document.getElementById('server-select');
        sel.innerHTML = servers
          .map((s) => `<option value="${s.id}" ${s.id === selectedServerId ? 'selected' : ''}>${API.escapeHtml(s.name)}</option>`)
          .join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadServices() {
      if (!selectedServerId) {
        document.getElementById('svc-body').innerHTML =
          `<tr><td colspan="8" class="empty-state" style="padding:24px;">No server selected</td></tr>`;
        return;
      }
      try {
        const data = await API.apiFetch(`/api/servers/${selectedServerId}/services`);
        services = data.services || [];
        sourceMeta = data.sources || [];
        renderChips();
        renderSourceNotes();
        renderTable();
      } catch (e) {
        services = [];
        document.getElementById('svc-body').innerHTML =
          `<tr><td colspan="8" class="empty-state" style="padding:24px;">${API.escapeHtml(e.message)}</td></tr>`;
      }
    }

    function renderChips() {
      const present = ['all', ...sourceMeta.map((s) => s.name)];
      if (!present.includes(sourceFilter)) sourceFilter = 'all';
      const el = document.getElementById('source-chips');
      el.innerHTML = present
        .map((name) => `<span class="chip ${name === sourceFilter ? 'active' : ''}" data-src="${name}">${name}</span>`)
        .join('');
      el.querySelectorAll('.chip').forEach((c) => {
        c.onclick = () => { sourceFilter = c.dataset.src; renderChips(); renderTable(); };
      });
    }

    // Surface unavailable sources or per-source errors so a host without PM2 /
    // systemd (or one lacking permission) is explained, not silently empty.
    function renderSourceNotes() {
      const notes = [];
      for (const s of sourceMeta) {
        if (s.available === false) notes.push(`${s.name}: not available on this host`);
        else if (s.error) notes.push(`${s.name}: ${s.error}`);
      }
      document.getElementById('src-notes').innerHTML = notes.length
        ? `<div class="src-note">${notes.map(API.escapeHtml).join(' · ')}</div>`
        : '';
    }

    function renderTable() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const list = services
        .filter((s) => sourceFilter === 'all' || s.source === sourceFilter)
        .filter((s) => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q));
      const body = document.getElementById('svc-body');
      if (!list.length) {
        body.innerHTML = `<tr><td colspan="8" class="empty-state" style="padding:24px;">No services</td></tr>`;
        return;
      }
      const isAdmin = user && user.role === 'admin';
      body.innerHTML = list
        .map((s) => {
          const running = s.status === 'running';
          const actions = isAdmin
            ? `<div class="row-actions">
                 <button data-act="start" ${running ? 'disabled' : ''}>Start</button>
                 <button data-act="stop" ${!running ? 'disabled' : ''}>Stop</button>
                 <button data-act="restart">Restart</button>
                 <button class="ghost" data-act="logs">Logs</button>
               </div>`
            : `<div class="row-actions"><button class="ghost" data-act="logs">Logs</button></div>`;
          return `<tr data-source="${s.source}" data-id="${API.escapeHtml(s.id)}">
            <td><span class="svc-name">${API.escapeHtml(s.name)}</span></td>
            <td><span class="badge ${s.source}">${s.source.toUpperCase()}</span></td>
            <td><span class="state ${s.status}">${s.status}</span></td>
            <td class="num">${s.cpuPct == null ? '—' : s.cpuPct.toFixed(1)}</td>
            <td class="num">${s.memBytes == null ? '—' : fmtBytes(s.memBytes)}</td>
            <td class="num">${s.restarts == null ? '—' : s.restarts}</td>
            <td class="num">${s.uptimeMs == null ? '—' : fmtUptime(s.uptimeMs)}</td>
            <td>${actions}</td>
          </tr>`;
        })
        .join('');
      body.querySelectorAll('tr').forEach((tr) => {
        tr.querySelectorAll('button[data-act]').forEach((btn) => {
          btn.onclick = () => {
            const act = btn.dataset.act;
            const svc = { source: tr.dataset.source, id: tr.dataset.id, name: tr.querySelector('.svc-name').textContent };
            if (act === 'logs') openLogs(svc);
            else doAction(svc, act);
          };
        });
      });
    }

    async function doAction(svc, action) {
      try {
        await API.apiFetch(
          `/api/servers/${selectedServerId}/services/${svc.source}/${encodeURIComponent(svc.id)}/${action}`,
          { method: 'POST' }
        );
        setTimeout(loadServices, 600);
      } catch (e) {
        alert(`Action failed: ${e.message}`);
      }
    }

    function openLogs(svc) {
      closeLogs();
      document.getElementById('lm-source').textContent = svc.source.toUpperCase();
      document.getElementById('lm-source').className = `badge ${svc.source}`;
      document.getElementById('lm-title').textContent = svc.name;
      const view = document.getElementById('lm-logs');
      view.textContent = '';
      document.getElementById('logs-modal').classList.add('open');
      const token = API.getToken();
      const url = `/api/servers/${selectedServerId}/services/${svc.source}/${encodeURIComponent(svc.id)}/logs?token=${encodeURIComponent(token)}`;
      logStream = new EventSource(url);
      logStream.onmessage = (ev) => {
        try {
          const { line } = JSON.parse(ev.data);
          const div = document.createElement('div');
          div.className = 'log-line';
          div.textContent = line;
          view.appendChild(div);
          if (view.childElementCount > 1000) view.removeChild(view.firstChild);
          view.scrollTop = view.scrollHeight;
        } catch (_) {}
      };
      logStream.addEventListener('error', () => {});
    }

    function closeLogs() {
      if (logStream) { logStream.close(); logStream = null; }
      document.getElementById('logs-modal').classList.remove('open');
    }

    function fmtBytes(n) {
      if (!n || n <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function fmtUptime(ms) {
      const s = Math.floor(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ${m % 60}m`;
      return `${Math.floor(h / 24)}d ${h % 24}h`;
    }

    boot();
  </script>
</body>
</html>
